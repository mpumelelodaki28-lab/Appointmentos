<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Services - AppointmentOS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fa;
            color: #222;
        }


        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #071a3d;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .nav-item {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #12336f;
        }


        /* MAIN */

        .main {
            margin-left: 240px;
            padding: 35px;
        }


        /* HEADER */

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top h1 {
            color: #071a3d;
        }

        .add-button {
            background: #071a3d;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button:hover {
            background: #12336f;
        }


        /* SUMMARY */

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 25px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.05);
        }

        .summary-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-number {
            font-size: 30px;
            font-weight: bold;
            color: #071a3d;
        }


        /* SEARCH */

        .search {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 15px;
            background: white;
        }


        /* TABLE */

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            background: #f4f6fa;
            color: #071a3d;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }


        /* ACTION BUTTONS */

        .action-button {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            background: #071a3d;
            color: white;
            margin-right: 5px;
        }

        .action-button:hover {
            background: #12336f;
        }

        .action-button.delete {
            background: #dc3545;
        }

        .action-button.delete:hover {
            background: #b02a37;
        }


        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            position: relative;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #071a3d;
        }

        .modal-content label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
        }

        .save-button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #071a3d;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #12336f;
        }


        /* EMPTY */

        .empty-message {
            text-align: center;
            padding: 35px;
            color: #777;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                padding: 20px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .add-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            AppointmentOS
        </div>


        <a
            href="dashboard.html"
            class="nav-item">

            Dashboard

        </a>


        <a
            href="appointments.html"
            class="nav-item">

            Appointments

        </a>


        <a
            href="customers.html"
            class="nav-item">

            Customers

        </a>


        <a
            href="services.html"
            class="nav-item active">

            Services

        </a>


        <a
            href="staff.html"
            class="nav-item">

            Staff

        </a>


        <a
            href="reports.html"
            class="nav-item">

            Reports

        </a>


        <a
            href="settings.html"
            class="nav-item">

            Settings

        </a>

    </div>



    <!-- MAIN -->

    <main class="main">


        <div class="top">

            <h1>
                Services
            </h1>


            <button
                class="add-button"
                onclick="openServiceForm()">

                + Add Service

            </button>

        </div>



        <!-- SUMMARY -->

        <div class="summary-card">

            <div class="summary-title">
                Total Services
            </div>

            <div
                class="summary-number"
                id="serviceCount">

                0

            </div>

        </div>



        <!-- SEARCH -->

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Search services...">



        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Service
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Duration
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="serviceTable">

                </tbody>

            </table>


            <div
                id="emptyMessage"
                class="empty-message"
                style="display:none;">

                No services found.

            </div>

        </div>

    </main>



    <!-- SERVICE MODAL -->

    <div
        id="serviceModal"
        class="modal">


        <div class="modal-content">


            <span
                class="close"
                onclick="closeServiceForm()">

                &times;

            </span>


            <h2 id="serviceModalTitle">

                Add Service

            </h2>



            <form id="serviceForm">


                <label>
                    Service Name
                </label>

                <input
                    type="text"
                    id="serviceName"
                    placeholder="e.g. Haircut"
                    required>



                <label>
                    Price (R)
                </label>

                <input
                    type="number"
                    id="servicePrice"
                    placeholder="e.g. 150"
                    min="0"
                    step="0.01"
                    required>



                <label>
                    Duration
                </label>

                <select
                    id="serviceDuration"
                    required>

                    <option value="">
                        Select duration
                    </option>

                    <option value="15 minutes">
                        15 minutes
                    </option>

                    <option value="30 minutes">
                        30 minutes
                    </option>

                    <option value="45 minutes">
                        45 minutes
                    </option>

                    <option value="1 hour">
                        1 hour
                    </option>

                    <option value="1 hour 30 minutes">
                        1 hour 30 minutes
                    </option>

                    <option value="2 hours">
                        2 hours
                    </option>

                    <option value="Custom">
                        Custom
                    </option>

                </select>



                <button
                    type="submit"
                    class="save-button"
                    id="saveButton">

                    Save Service

                </button>


            </form>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script>


        const serviceTable =
            document.getElementById("serviceTable");


        const serviceCount =
            document.getElementById("serviceCount");


        const emptyMessage =
            document.getElementById("emptyMessage");


        let editingIndex = null;



        /* OPEN ADD FORM */

        function openServiceForm() {

            editingIndex = null;

            document
                .getElementById("serviceForm")
                .reset();

            document
                .getElementById("serviceModalTitle")
                .textContent =
                "Add Service";

            document
                .getElementById("saveButton")
                .textContent =
                "Save Service";

            document
                .getElementById("serviceModal")
                .style.display =
                "flex";

        }



        /* CLOSE */

        function closeServiceForm() {

            document
                .getElementById("serviceModal")
                .style.display =
                "none";

            editingIndex = null;

        }



        /* LOAD SERVICES */

        function loadServices() {

            const services =
                JSON.parse(
                    localStorage.getItem("services")
                ) || [];


            serviceTable.innerHTML = "";


            serviceCount.textContent =
                services.length;


            if (services.length === 0) {

                emptyMessage.style.display =
                    "block";

                return;

            }


            emptyMessage.style.display =
                "none";


            services.forEach(
                function(service, index) {


                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${escapeHTML(service.name)}
                        </td>

                        <td>
                            R${Number(service.price).toFixed(2)}
                        </td>

                        <td>
                            ${escapeHTML(service.duration)}
                        </td>

                        <td>

                            <button
                                class="action-button"
                                onclick="editService(${index})">

                                Edit

                            </button>


                            <button
                                class="action-button delete"
                                onclick="deleteService(${index})">

                                Delete

                            </button>

                        </td>

                    `;


                    serviceTable.appendChild(row);

                }
            );

        }



        /* ADD / EDIT SERVICE */

        document
            .getElementById("serviceForm")
            .addEventListener(
                "submit",
                function(event) {


                    event.preventDefault();


                    const name =
                        document
                            .getElementById("serviceName")
                            .value
                            .trim();


                    const price =
                        document
                            .getElementById("servicePrice")
                            .value;


                    const duration =
                        document
                            .getElementById("serviceDuration")
                            .value;


                    const services =
                        JSON.parse(
                            localStorage.getItem("services")
                        ) || [];



                    /* EDIT */

                    if (editingIndex !== null) {

                        services[editingIndex] = {

                            ...services[editingIndex],

                            name: name,

                            price: price,

                            duration: duration

                        };

                    }


                    /* ADD */

                    else {

                        services.push({

                            name: name,

                            price: price,

                            duration: duration

                        });

                    }



                    localStorage.setItem(
                        "services",
                        JSON.stringify(services)
                    );


                    editingIndex = null;


                    document
                        .getElementById("serviceForm")
                        .reset();


                    closeServiceForm();


                    loadServices();

                }
            );



        /* EDIT SERVICE */

        function editService(index) {


            const services =
                JSON.parse(
                    localStorage.getItem("services")
                ) || [];


            const service =
                services[index];


            if (!service) {

                return;

            }


            document
                .getElementById("serviceName")
                .value =
                service.name;


            document
                .getElementById("servicePrice")
                .value =
                service.price;


            document
                .getElementById("serviceDuration")
                .value =
                service.duration;


            editingIndex =
                index;


            document
                .getElementById("serviceModalTitle")
                .textContent =
                "Edit Service";


            document
                .getElementById("saveButton")
                .textContent =
                "Update Service";


            document
                .getElementById("serviceModal")
                .style.display =
                "flex";

        }



        /* DELETE SERVICE */

        function deleteService(index) {


            const services =
                JSON.parse(
                    localStorage.getItem("services")
                ) || [];


            const service =
                services[index];


            if (!service) {

                return;

            }


            const confirmed =
                confirm(
                    "Delete " +
                    service.name +
                    "?"
                );


            if (!confirmed) {

                return;

            }


            services.splice(index, 1);


            localStorage.setItem(
                "services",
                JSON.stringify(services)
            );


            loadServices();

        }



        /* SEARCH */

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                function() {


                    const search =
                        this.value
                            .toLowerCase()
                            .trim();


                    const rows =
                        serviceTable
                            .querySelectorAll("tr");


                    let visibleRows = 0;


                    rows.forEach(
                        function(row) {


                            const text =
                                row.textContent
                                    .toLowerCase();


                            if (
                                text.includes(search)
                            ) {

                                row.style.display =
                                    "";

                                visibleRows++;

                            }

                            else {

                                row.style.display =
                                    "none";

                            }

                        }
                    );


                    if (visibleRows === 0) {

                        emptyMessage.style.display =
                            "block";

                    }

                    else {

                        emptyMessage.style.display =
                            "none";

                    }

                }
            );



        /* ESCAPE HTML */

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value || "";

            return div.innerHTML;

        }



        /* START */

        loadServices();


    </script>


</body>

</html>
