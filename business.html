<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Setup - AppointmentOS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #222;
}

.header {
    background: #071a3d;
    color: white;
    padding: 20px 35px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
    color: #071a3d;
    margin-bottom: 10px;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 7px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.save-button {
    width: 100%;
    margin-top: 30px;
    padding: 15px;
    background: #071a3d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.save-button:hover {
    background: #12366f;
}

.success {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #dff5e5;
    color: #187a35;
    border-radius: 8px;
}

.booking-link {
    margin-top: 20px;
    padding: 15px;
    background: #f1f3f6;
    border-radius: 8px;
    word-break: break-all;
}

.booking-link strong {
    display: block;
    margin-bottom: 8px;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #071a3d;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">AppointmentOS</div>
</div>

<div class="container">

    <div class="card">

        <h1>Set Up Your Business</h1>

        <p class="subtitle">
            Add your business information to create your AppointmentOS booking profile.
        </p>

        <form id="businessForm">

            <label>Business Name</label>

            <input
                type="text"
                id="businessName"
                placeholder="e.g. Mpho's Barber Shop"
                required
            >


            <label>Business Type</label>

            <select id="businessType" required>

                <option value="">
                    Select business type
                </option>

                <option value="Barber & Salon">
                    Barber & Salon
                </option>

                <option value="Clinic">
                    Clinic
                </option>

                <option value="Doctor">
                    Doctor
                </option>

                <option value="Dentist">
                    Dentist
                </option>

                <option value="Mechanic">
                    Mechanic
                </option>

                <option value="Beauty">
                    Beauty
                </option>

                <option value="Spa">
                    Spa
                </option>

                <option value="Consulting">
                    Consulting
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Phone Number</label>

            <input
                type="tel"
                id="businessPhone"
                placeholder="e.g. 071 234 5678"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="businessEmail"
                placeholder="business@example.com"
                required
            >


            <label>Address</label>

            <input
                type="text"
                id="businessAddress"
                placeholder="Business address"
                required
            >


            <label>About Your Business</label>

            <textarea
                id="businessDescription"
                placeholder="Tell customers about your business..."
            ></textarea>


            <button
                type="submit"
                class="save-button">

                Create Business Profile

            </button>

        </form>


        <div
            class="success"
            id="successMessage">

            <strong>Business profile created!</strong>

            <div class="booking-link">

                <strong>Your booking page:</strong>

                <span id="bookingLink"></span>

            </div>

        </div>


        <a
            href="dashboard.html"
            class="back">

            ← Back to Dashboard

        </a>

    </div>

</div>


<script>

document
    .getElementById("businessForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const business = {

            name:
                document
                    .getElementById("businessName")
                    .value
                    .trim(),

            type:
                document
                    .getElementById("businessType")
                    .value,

            phone:
                document
                    .getElementById("businessPhone")
                    .value
                    .trim(),

            email:
                document
                    .getElementById("businessEmail")
                    .value
                    .trim(),

            address:
                document
                    .getElementById("businessAddress")
                    .value
                    .trim(),

            description:
                document
                    .getElementById("businessDescription")
                    .value
                    .trim()

        };


        localStorage.setItem(
            "business",
            JSON.stringify(business)
        );


        document
            .getElementById("successMessage")
            .style.display = "block";


        document
            .getElementById("bookingLink")
            .textContent =
            "booking.html";

    });


/* LOAD EXISTING BUSINESS */

const savedBusiness =
    JSON.parse(
        localStorage.getItem("business")
    );


if (savedBusiness) {

    document
        .getElementById("businessName")
        .value =
        savedBusiness.name || "";

    document
        .getElementById("businessType")
        .value =
        savedBusiness.type || "";

    document
        .getElementById("businessPhone")
        .value =
        savedBusiness.phone || "";

    document
        .getElementById("businessEmail")
        .value =
        savedBusiness.email || "";

    document
        .getElementById("businessAddress")
        .value =
        savedBusiness.address || "";

    document
        .getElementById("businessDescription")
        .value =
        savedBusiness.description || "";

}

</script>

</body>
</html>
