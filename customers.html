<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Customers - AppointmentOS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fa;
            color: #222;
        }


        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #071a3d;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .nav-item {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #12336f;
        }


        /* MAIN */

        .main {
            margin-left: 240px;
            padding: 35px;
        }


        /* HEADER */

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top h1 {
            color: #071a3d;
        }

        .add-button {
            background: #071a3d;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button:hover {
            background: #12336f;
        }


        /* CUSTOMER SUMMARY */

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .summary-title {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-number {
            font-size: 30px;
            font-weight: bold;
            color: #071a3d;
        }


        /* SEARCH */

        .search {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 15px;
            background: white;
        }


        /* TABLE */

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            background: #f4f6fa;
            color: #071a3d;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }


        /* ACTION BUTTONS */

        .action-button {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            background: #071a3d;
            color: white;
            margin-right: 5px;
        }

        .action-button:hover {
            background: #12336f;
        }

        .action-button.delete {
            background: #dc3545;
        }

        .action-button.delete:hover {
            background: #b02a37;
        }


        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #071a3d;
        }

        .modal-content label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .modal-content textarea {
            height: 90px;
            resize: vertical;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
        }

        .save-button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #071a3d;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #12336f;
        }


        /* EMPTY MESSAGE */

        .empty-message {
            text-align: center;
            padding: 35px;
            color: #777;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                padding: 20px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .add-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            AppointmentOS
        </div>


        <a
            href="dashboard.html"
            class="nav-item">

            Dashboard

        </a>


        <a
            href="appointments.html"
            class="nav-item">

            Appointments

        </a>


        <a
            href="customers.html"
            class="nav-item active">

            Customers

        </a>


        <a
            href="#"
            class="nav-item">

            Services

        </a>


        <a
            href="#"
            class="nav-item">

            Staff

        </a>


        <a
            href="#"
            class="nav-item">

            Reports

        </a>


        <a
            href="#"
            class="nav-item">

            Settings

        </a>

    </div>



    <!-- MAIN -->

    <main class="main">


        <div class="top">

            <h1>
                Customers
            </h1>


            <button
                class="add-button"
                onclick="openCustomerForm()">

                + Add Customer

            </button>

        </div>



        <!-- CUSTOMER COUNT -->

        <div class="summary-card">

            <div class="summary-title">
                Total Customers
            </div>

            <div
                class="summary-number"
                id="customerCount">

                0

            </div>

        </div>



        <!-- SEARCH -->

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Search customers by name, phone or email...">



        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Date Added
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="customerTable">

                </tbody>

            </table>


            <div
                id="emptyMessage"
                class="empty-message"
                style="display:none;">

                No customers found.

            </div>

        </div>

    </main>



    <!-- CUSTOMER MODAL -->

    <div
        id="customerModal"
        class="modal">


        <div class="modal-content">


            <span
                class="close"
                onclick="closeCustomerForm()">

                &times;

            </span>


            <h2 id="customerModalTitle">

                Add Customer

            </h2>



            <form id="customerForm">


                <label>
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter customer name"
                    required>



                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="customerPhone"
                    placeholder="e.g. 071 234 5678"
                    required>



                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="customerEmail"
                    placeholder="customer@email.com">



                <label>
                    Notes
                </label>

                <textarea
                    id="customerNotes"
                    placeholder="Optional notes about the customer...">
                </textarea>



                <button
                    type="submit"
                    class="save-button"
                    id="saveButton">

                    Save Customer

                </button>


            </form>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script>


        const customerTable =
            document.getElementById("customerTable");


        const customerCount =
            document.getElementById("customerCount");


        const emptyMessage =
            document.getElementById("emptyMessage");


        let editingIndex = null;



        /* OPEN ADD FORM */

        function openCustomerForm() {


            editingIndex = null;


            document
                .getElementById("customerForm")
                .reset();


            document
                .getElementById("customerModalTitle")
                .textContent =
                "Add Customer";


            document
                .getElementById("saveButton")
                .textContent =
                "Save Customer";


            document
                .getElementById("customerModal")
                .style.display =
                "flex";

        }



        /* CLOSE FORM */

        function closeCustomerForm() {


            document
                .getElementById("customerModal")
                .style.display =
                "none";


            editingIndex = null;

        }



        /* LOAD CUSTOMERS */

        function loadCustomers() {


            const customers =
                JSON.parse(
                    localStorage.getItem("customers")
                ) || [];


            customerTable.innerHTML = "";


            customerCount.textContent =
                customers.length;


            if (customers.length === 0) {

                emptyMessage.style.display =
                    "block";

                return;

            }


            emptyMessage.style.display =
                "none";



            customers.forEach(
                function(customer, index) {


                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${escapeHTML(customer.name)}
                        </td>

                        <td>
                            ${escapeHTML(customer.phone)}
                        </td>

                        <td>
                            ${escapeHTML(customer.email || "-")}
                        </td>

                        <td>
                            ${escapeHTML(customer.dateAdded)}
                        </td>

                        <td>

                            <button
                                class="action-button"
                                onclick="editCustomer(${index})">

                                Edit

                            </button>


                            <button
                                class="action-button delete"
                                onclick="deleteCustomer(${index})">

                                Delete

                            </button>

                        </td>

                    `;


                    customerTable.appendChild(row);

                }
            );

        }



        /* ADD / EDIT CUSTOMER */

        document
            .getElementById("customerForm")
            .addEventListener(
                "submit",
                function(event) {


                    event.preventDefault();



                    const name =
                        document
                            .getElementById("customerName")
                            .value
                            .trim();


                    const phone =
                        document
                            .getElementById("customerPhone")
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById("customerEmail")
                            .value
                            .trim();


                    const notes =
                        document
                            .getElementById("customerNotes")
                            .value
                            .trim();



                    const customers =
                        JSON.parse(
                            localStorage.getItem("customers")
                        ) || [];



                    /* EDIT */

                    if (editingIndex !== null) {


                        customers[editingIndex] = {

                            ...customers[editingIndex],

                            name: name,

                            phone: phone,

                            email: email,

                            notes: notes

                        };


                    }


                    /* ADD */

                    else {


                        const today =
                            new Date()
                                .toISOString()
                                .split("T")[0];


                        customers.push({

                            name: name,

                            phone: phone,

                            email: email,

                            notes: notes,

                            dateAdded: today

                        });

                    }



                    localStorage.setItem(
                        "customers",
                        JSON.stringify(customers)
                    );



                    editingIndex = null;



                    document
                        .getElementById("customerForm")
                        .reset();



                    closeCustomerForm();


                    loadCustomers();

                }
            );



        /* EDIT CUSTOMER */

        function editCustomer(index) {


            const customers =
                JSON.parse(
                    localStorage.getItem("customers")
                ) || [];


            const customer =
                customers[index];


            if (!customer) {

                return;

            }



            document
                .getElementById("customerName")
                .value =
                customer.name;


            document
                .getElementById("customerPhone")
                .value =
                customer.phone;


            document
                .getElementById("customerEmail")
                .value =
                customer.email || "";


            document
                .getElementById("customerNotes")
                .value =
                customer.notes || "";



            editingIndex =
                index;



            document
                .getElementById("customerModalTitle")
                .textContent =
                "Edit Customer";


            document
                .getElementById("saveButton")
                .textContent =
                "Update Customer";



            document
                .getElementById("customerModal")
                .style.display =
                "flex";

        }



        /* DELETE CUSTOMER */

        function deleteCustomer(index) {


            const customers =
                JSON.parse(
                    localStorage.getItem("customers")
                ) || [];


            const customer =
                customers[index];


            if (!customer) {

                return;

            }



            const confirmed =
                confirm(
                    "Delete " +
                    customer.name +
                    "?"
                );


            if (!confirmed) {

                return;

            }



            customers.splice(index, 1);



            localStorage.setItem(
                "customers",
                JSON.stringify(customers)
            );


            loadCustomers();

        }



        /* SEARCH */

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                function() {


                    const search =
                        this.value
                            .toLowerCase()
                            .trim();


                    const rows =
                        customerTable
                            .querySelectorAll("tr");


                    let visibleRows = 0;



                    rows.forEach(
                        function(row) {


                            const text =
                                row.textContent
                                    .toLowerCase();


                            if (
                                text.includes(search)
                            ) {


                                row.style.display =
                                    "";


                                visibleRows++;


                            }


                            else {


                                row.style.display =
                                    "none";

                            }

                        }
                    );



                    if (visibleRows === 0) {

                        emptyMessage.style.display =
                            "block";

                    }

                    else {

                        emptyMessage.style.display =
                            "none";

                    }

                }
            );



        /* ESCAPE HTML */

        function escapeHTML(value) {


            const div =
                document.createElement("div");


            div.textContent =
                value || "";


            return div.innerHTML;

        }



        /* START */

        loadCustomers();


    </script>


</body>

</html>
