<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AppointmentOS Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071a3d;
            color: white;
        }

        header {
            background: #102852;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #cbd5e1;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #102852;
            padding: 25px;
            border-radius: 15px;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
        }

        .section {
            background: #102852;
            padding: 25px;
            border-radius: 15px;
            margin-top: 25px;
        }

        .appointment {
            background: #183968;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>AppointmentOS</h1>
    <p>Business Dashboard</p>
</header>

<div class="container">

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h3>Today's Appointments</h3>
            <div class="number">12</div>
        </div>

        <div class="card">
            <h3>New Customers</h3>
            <div class="number">8</div>
        </div>

        <div class="card">
            <h3>Upcoming Appointments</h3>
            <div class="number">24</div>
        </div>

    </div>

    <div class="section">

        <h2>Today's Appointments</h2>

        <div class="appointment">
            <strong>09:00</strong> — John Smith
        </div>

        <div class="appointment">
            <strong>10:30</strong> — Sarah Williams
        </div>

        <div class="appointment">
            <strong>13:00</strong> — Michael Brown
        </div>

    </div>

    <div class="section">

        <h2>Quick Actions</h2>

        <button>onclick="addAppointment()">Add Appoin</button>
        <button>Add Customer</button>
        <button>View Calendar</button>

    </div>

</div>
<script>
function addAppointment() {
    alert("Appointment form coming soon!");
}
</script>

</body>
</html>
