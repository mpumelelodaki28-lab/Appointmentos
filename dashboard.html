<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointments - AppointmentOS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fa;
            color: #222;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #071a3d;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .nav-item {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #12336f;
        }

        /* MAIN */

        .main {
            margin-left: 240px;
            padding: 35px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top h1 {
            color: #071a3d;
        }

        .add-button {
            background: #071a3d;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button:hover {
            background: #12336f;
        }

        /* SEARCH */

        .search {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 15px;
        }

        /* TABLE */

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            background: #f4f6fa;
            color: #071a3d;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .status {
            background: #e5f7e9;
            color: #218838;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* ACTION BUTTONS */

        .action-button {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            background: #071a3d;
            color: white;
            margin-right: 5px;
        }

        .action-button:hover {
            background: #12336f;
        }

        .action-button.delete {
            background: #dc3545;
        }

        .action-button.delete:hover {
            background: #b02a37;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            position: relative;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #071a3d;
        }

        .modal-content label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
        }

        .save-button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #071a3d;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #12336f;
        }

    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            AppointmentOS
        </div>

        <a href="dashboard.html" class="nav-item">
            Dashboard
        </a>

        <a href="appointments.html" class="nav-item active">
            Appointments
        </a>

        <a href="#" class="nav-item">
            Customers
        </a>

        <a href="#" class="nav-item">
            Services
        </a>

        <a href="#" class="nav-item">
            Staff
        </a>

        <a href="#" class="nav-item">
            Reports
        </a>

        <a href="#" class="nav-item">
            Settings
        </a>

    </div>


    <!-- MAIN CONTENT -->

    <main class="main">

        <div class="top">

            <h1>Appointments</h1>

            <button
                class="add-button"
                onclick="openAppointmentForm()">

                + Add Appointment

            </button>

        </div>


        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Search appointments...">


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Customer</th>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="appointmentTable">

                </tbody>

            </table>

        </div>

    </main>


    <!-- ADD / EDIT APPOINTMENT POPUP -->

    <div id="appointmentModal" class="modal">

        <div class="modal-content">

            <span
                class="close"
                onclick="closeAppointmentForm()">
                &times;
            </span>

            <h2 id="appointmentModalTitle">
                Add Appointment
            </h2>

            <form id="appointmentForm">

                <label>
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter customer name"
                    required>


                <label>
                    Service
                </label>

                <input
                    type="text"
                    id="serviceName"
                    placeholder="e.g. Haircut"
                    required>


                <label>
                    Date
                </label>

                <input
                    type="date"
                    id="appointmentDate"
                    required>


                <label>
                    Time
                </label>

                <input
                    type="time"
                    id="appointmentTime"
                    required>


                <button
                    type="submit"
                    class="save-button"
                    id="saveButton">

                    Save Appointment

                </button>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        const appointmentTable =
            document.getElementById("appointmentTable");

        let editingIndex = null;


        /* OPEN ADD FORM */

        function openAppointmentForm() {

            editingIndex = null;

            document.getElementById("appointmentForm").reset();

            document.getElementById("appointmentModalTitle").textContent =
                "Add Appointment";

            document.getElementById("saveButton").textContent =
                "Save Appointment";

            document.getElementById("appointmentModal").style.display =
                "flex";
        }


        /* CLOSE FORM */

        function closeAppointmentForm() {

            document.getElementById("appointmentModal").style.display =
                "none";

            editingIndex = null;
        }


        /* LOAD APPOINTMENTS */

        function loadAppointments() {

            const appointments =
                JSON.parse(localStorage.getItem("appointments")) || [];

            appointmentTable.innerHTML = "";


            appointments.forEach(function(appointment, index) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${appointment.customer}
                    </td>

                    <td>
                        ${appointment.service}
                    </td>

                    <td>
                        ${appointment.date}
                    </td>

                    <td>
                        ${appointment.time}
                    </td>

                    <td>

                        <span class="status">
                            Confirmed
                        </span>

                    </td>

                    <td>

                        <button
                            class="action-button"
                            onclick="editAppointment(${index})">

                            Edit

                        </button>

                        <button
                            class="action-button delete"
                            onclick="deleteAppointment(${index})">

                            Delete

                        </button>

                    </td>

                `;


                appointmentTable.appendChild(row);

            });

        }


        /* EDIT APPOINTMENT */

        function editAppointment(index) {

            const appointments =
                JSON.parse(localStorage.getItem("appointments")) || [];


            const appointment =
                appointments[index];


            if (!appointment) {
                return;
            }


            document.getElementById("customerName").value =
                appointment.customer;

            document.getElementById("serviceName").value =
                appointment.service;

            document.getElementById("appointmentDate").value =
                appointment.date;

            document.getElementById("appointmentTime").value =
                appointment.time;


            editingIndex = index;


            document.getElementById("appointmentModalTitle").textContent =
                "Edit Appointment";

            document.getElementById("saveButton").textContent =
                "Update Appointment";


            document.getElementById("appointmentModal").style.display =
                "flex";

        }


        /* SAVE / UPDATE */

        document
            .getElementById("appointmentForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const customer =
                    document.getElementById("customerName").value;

                const service =
                    document.getElementById("serviceName").value;

                const date =
                    document.getElementById("appointmentDate").value;

                const time =
                    document.getElementById("appointmentTime").value;


                const appointments =
                    JSON.parse(localStorage.getItem("appointments")) || [];


                /* UPDATE EXISTING */

                if (editingIndex !== null) {

                    appointments[editingIndex] = {

                        customer: customer,
                        service: service,
                        date: date,
                        time: time

                    };

                }

                /* ADD NEW */

                else {

                    appointments.push({

                        customer: customer,
                        service: service,
                        date: date,
                        time: time

                    });

                }


                localStorage.setItem(
                    "appointments",
                    JSON.stringify(appointments)
                );


                editingIndex = null;


                document
                    .getElementById("appointmentForm")
                    .reset();


                closeAppointmentForm();


                loadAppointments();

            });


        /* DELETE */

        function deleteAppointment(index) {

            const appointments =
                JSON.parse(localStorage.getItem("appointments")) || [];


            appointments.splice(index, 1);


            localStorage.setItem(
                "appointments",
                JSON.stringify(appointments)
            );


            loadAppointments();

        }


        /* SEARCH */

        document
            .getElementById("searchInput")
            .addEventListener("input", function() {

                const search =
                    this.value.toLowerCase();

                const rows =
                    appointmentTable.querySelectorAll("tr");


                rows.forEach(function(row) {

                    const text =
                        row.textContent.toLowerCase();

                    if (text.includes(search)) {

                        row.style.display = "";

                    }

                    else {

                        row.style.display = "none";

                    }

                });

            });


        /* START */

        loadAppointments();

    </script>

</body>

</html>
