<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard - AppointmentOS</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6fa;
            color: #222;
        }


        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #071a3d;
            color: white;
            padding: 25px 15px;
        }


        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }


        .nav-item {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }


        .nav-item:hover,
        .nav-item.active {
            background: #12336f;
        }


        /* MAIN */

        .main {
            margin-left: 240px;
            padding: 35px;
        }


        .header {
            margin-bottom: 30px;
        }


        .header h1 {
            color: #071a3d;
            margin-bottom: 8px;
        }


        .header p {
            color: #777;
        }


        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.05);
        }


        .card-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }


        .card-number {
            font-size: 30px;
            font-weight: bold;
            color: #071a3d;
        }


        /* CONTENT GRID */

        .content-grid {
            display: grid;
            grid-template-columns:
                2fr 1fr;

            gap: 25px;
        }


        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.05);
        }


        .section h2 {
            color: #071a3d;
            margin-bottom: 20px;
        }


        /* APPOINTMENTS */

        .appointment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 0;

            border-bottom:
                1px solid #eee;
        }


        .appointment-item:last-child {
            border-bottom: none;
        }


        .appointment-name {
            font-weight: bold;
            margin-bottom: 5px;
        }


        .appointment-service {
            color: #777;
            font-size: 14px;
        }


        .appointment-time {
            font-weight: bold;
            color: #071a3d;
        }


        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }


        /* QUICK ACTIONS */

        .quick-action {
            display: block;

            width: 100%;

            padding: 14px;

            margin-bottom: 12px;

            background: #071a3d;

            color: white;

            border: none;

            border-radius: 8px;

            text-decoration: none;

            text-align: center;

            cursor: pointer;

            font-weight: bold;
        }


        .quick-action:hover {
            background: #12336f;
        }


        /* MOBILE */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 700px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">


        <div class="logo">
            AppointmentOS
        </div>


        <a
            href="dashboard.html"
            class="nav-item active">

            Dashboard

        </a>


        <a
            href="appointments.html"
            class="nav-item">

            Appointments

        </a>


        <a
            href="customers.html"
            class="nav-item">

            Customers

        </a>


        <a
            href="services.html"
            class="nav-item">

            Services

        </a>


        <a
            href="staff.html"
            class="nav-item">

            Staff

        </a>


        <a
            href="reports.html"
            class="nav-item">

            Reports

        </a>


        <a
            href="settings.html"
            class="nav-item">

            Settings

        </a>


    </div>



    <!-- MAIN -->

    <main class="main">


        <!-- HEADER -->

        <div class="header">

            <h1>
                Dashboard
            </h1>

            <p>
                Welcome to AppointmentOS
            </p>

        </div>



        <!-- SUMMARY CARDS -->

        <div class="cards">


            <!-- APPOINTMENTS -->

            <div class="card">

                <div class="card-title">
                    Total Appointments
                </div>

                <div
                    class="card-number"
                    id="appointmentCount">

                    0

                </div>

            </div>



            <!-- UPCOMING -->

            <div class="card">

                <div class="card-title">
                    Upcoming Appointments
                </div>

                <div
                    class="card-number"
                    id="upcomingCount">

                    0

                </div>

            </div>



            <!-- CUSTOMERS -->

            <div class="card">

                <div class="card-title">
                    Total Customers
                </div>

                <div
                    class="card-number"
                    id="customerCount">

                    0

                </div>

            </div>



            <!-- REVENUE -->

            <div class="card">

                <div class="card-title">
                    Today's Revenue
                </div>

                <div
                    class="card-number"
                    id="revenue">

                    R0

                </div>

            </div>


        </div>



        <!-- CONTENT -->

        <div class="content-grid">


            <!-- APPOINTMENTS -->

            <div class="section">


                <h2>
                    Recent Appointments
                </h2>


                <div
                    id="appointmentList">

                </div>


            </div>



            <!-- QUICK ACTIONS -->

            <div class="section">


                <h2>
                    Quick Actions
                </h2>


                <a
                    href="appointments.html"
                    class="quick-action">

                    + Add Appointment

                </a>


                <a
                    href="customers.html"
                    class="quick-action">

                    + Add Customer

                </a>


                <a
                    href="services.html"
                    class="quick-action">

                    + Add Service

                </a>


                <a
                    href="staff.html"
                    class="quick-action">

                    + Add Staff

                </a>


            </div>


        </div>


    </main>



    <!-- JAVASCRIPT -->

    <script>


        /* LOAD DASHBOARD */

        function loadDashboard() {


            /* APPOINTMENTS */

            const appointments =
                JSON.parse(
                    localStorage.getItem("appointments")
                ) || [];


            /* CUSTOMERS */

            const customers =
                JSON.parse(
                    localStorage.getItem("customers")
                ) || [];



            /* TOTAL APPOINTMENTS */

            document
                .getElementById("appointmentCount")
                .textContent =
                appointments.length;



            /* TOTAL CUSTOMERS */

            document
                .getElementById("customerCount")
                .textContent =
                customers.length;



            /* UPCOMING APPOINTMENTS */

            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];


            const upcoming =
                appointments.filter(
                    function(appointment) {

                        return appointment.date >= today;

                    }
                );


            document
                .getElementById("upcomingCount")
                .textContent =
                upcoming.length;



            /* REVENUE */

            /*
                Revenue will be connected
                to Services later.
            */

            document
                .getElementById("revenue")
                .textContent =
                "R0";



            /* APPOINTMENT LIST */

            const appointmentList =
                document.getElementById(
                    "appointmentList"
                );


            appointmentList.innerHTML = "";



            if (appointments.length === 0) {

                appointmentList.innerHTML = `

                    <div class="empty">

                        No appointments yet.

                    </div>

                `;

                return;

            }



            /* SHOW RECENT APPOINTMENTS */

            const recent =
                appointments.slice(-5).reverse();



            recent.forEach(
                function(appointment) {


                    const item =
                        document.createElement("div");


                    item.className =
                        "appointment-item";


                    item.innerHTML = `

                        <div>

                            <div class="appointment-name">

                                ${escapeHTML(
                                    appointment.customer
                                )}

                            </div>

                            <div class="appointment-service">

                                ${escapeHTML(
                                    appointment.service
                                )}

                            </div>

                        </div>


                        <div class="appointment-time">

                            ${escapeHTML(
                                appointment.time
                            )}

                        </div>

                    `;


                    appointmentList.appendChild(item);

                }
            );

        }



        /* SECURITY */

        function escapeHTML(value) {


            const div =
                document.createElement("div");


            div.textContent =
                value || "";


            return div.innerHTML;

        }



        /* START DASHBOARD */

        loadDashboard();


    </script>


</body>

</html>
