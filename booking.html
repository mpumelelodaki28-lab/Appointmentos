<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment - AppointmentOS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #222;
}

.header {
    background: #071a3d;
    color: white;
    padding: 20px 35px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.container {
    max-width: 750px;
    margin: 35px auto;
    padding: 20px;
}

.business-card,
.booking-card,
.success-card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.business-name {
    color: #071a3d;
    font-size: 30px;
    margin-bottom: 8px;
}

.business-type {
    color: #666;
    margin-bottom: 15px;
}

.business-info {
    line-height: 1.8;
}

h2 {
    color: #071a3d;
    margin-bottom: 20px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 17px;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

.time-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.time-button {
    padding: 12px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 7px;
    cursor: pointer;
}

.time-button:hover {
    border-color: #071a3d;
}

.time-button.selected {
    background: #071a3d;
    color: white;
}

.book-button {
    width: 100%;
    margin-top: 30px;
    padding: 15px;
    background: #071a3d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.book-button:hover {
    background: #12366f;
}

.success-card {
    display: none;
    text-align: center;
}

.success-card h2 {
    color: #187a35;
}

.confirmation {
    background: #f1f3f6;
    padding: 20px;
    border-radius: 8px;
    margin-top: 20px;
    text-align: left;
    line-height: 1.9;
}

@media (max-width: 600px) {

    .container {
        margin: 15px auto;
        padding: 10px;
    }

    .business-card,
    .booking-card,
    .success-card {
        padding: 22px;
    }

    .time-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .business-name {
        font-size: 25px;
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">AppointmentOS</div>
</div>


<div class="container">

    <!-- BUSINESS INFORMATION -->

    <div class="business-card">

        <div
            class="business-name"
            id="businessName">

            Your Business

        </div>

        <div
            class="business-type"
            id="businessType">

            Business

        </div>

        <div
            class="business-info">

            <div id="businessDescription"></div>

            <div id="businessAddress"></div>

            <div id="businessPhone"></div>

        </div>

    </div>


    <!-- BOOKING FORM -->

    <div
        class="booking-card"
        id="bookingCard">

        <h2>
            Book an Appointment
        </h2>

        <p class="subtitle">
            Choose a service, date and time.
        </p>


        <form id="bookingForm">

            <label>
                Your Name
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter your full name"
                required
            >


            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="customerPhone"
                placeholder="Enter your phone number"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="customerEmail"
                placeholder="Enter your email"
            >


            <label>
                Choose a Service
            </label>

            <select
                id="serviceSelect"
                required>

                <option value="">
                    Select a service
                </option>

            </select>


            <label>
                Choose a Date
            </label>

            <input
                type="date"
                id="appointmentDate"
                required
            >


            <label>
                Choose a Time
            </label>

            <div
                class="time-grid"
                id="timeGrid">

            </div>

            <input
                type="hidden"
                id="appointmentTime"
            >


            <button
                type="submit"
                class="book-button">

                Book Appointment

            </button>

        </form>

    </div>


    <!-- SUCCESS -->

    <div
        class="success-card"
        id="successCard">

        <h2>
            Appointment Booked!
        </h2>

        <p>
            Your appointment has been successfully submitted.
        </p>


        <div
            class="confirmation"
            id="confirmation">

        </div>

    </div>

</div>


<script>

/* =========================
   LOAD BUSINESS
========================= */

function loadBusiness() {

    const business =
        JSON.parse(
            localStorage.getItem("business")
        );


    if (!business) {

        document.getElementById("businessName")
            .textContent =
            "AppointmentOS Business";

        document.getElementById("businessType")
            .textContent =
            "Please set up the business profile.";

        return;
    }


    document.getElementById("businessName")
        .textContent =
        business.name || "Business";


    document.getElementById("businessType")
        .textContent =
        business.type || "";


    document.getElementById("businessDescription")
        .textContent =
        business.description
        ? "ℹ️ " + business.description
        : "";


    document.getElementById("businessAddress")
        .textContent =
        business.address
        ? "📍 " + business.address
        : "";


    document.getElementById("businessPhone")
        .textContent =
        business.phone
        ? "📞 " + business.phone
        : "";

}


/* =========================
   LOAD SERVICES
========================= */

function loadServices() {

    const services =
        JSON.parse(
            localStorage.getItem("services")
        ) || [];


    const select =
        document.getElementById("serviceSelect");


    select.innerHTML = `
        <option value="">
            Select a service
        </option>
    `;


    if (services.length === 0) {

        select.innerHTML = `
            <option value="">
                No services available
            </option>
        `;

        return;

    }


    services.forEach(function(service) {

        const option =
            document.createElement("option");


        option.value =
            service.name;


        option.textContent =
            service.name +
            " - R" +
            Number(service.price || 0)
                .toFixed(2);


        select.appendChild(option);

    });

}


/* =========================
   TIME SLOTS
========================= */

function createTimeSlots() {

    const times = [

        "08:00",
        "08:30",
        "09:00",
        "09:30",
        "10:00",
        "10:30",
        "11:00",
        "11:30",
        "12:00",
        "12:30",
        "13:00",
        "13:30",
        "14:00",
        "14:30",
        "15:00",
        "15:30",
        "16:00",
        "16:30"

    ];


    const grid =
        document.getElementById("timeGrid");


    grid.innerHTML = "";


    times.forEach(function(time) {

        const button =
            document.createElement("button");


        button.type = "button";


        button.className =
            "time-button";


        button.textContent =
            time;


        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(".time-button")
                    .forEach(function(item) {

                        item.classList.remove(
                            "selected"
                        );

                    });


                button.classList.add(
                    "selected"
                );


                document
                    .getElementById(
                        "appointmentTime"
                    )
                    .value = time;

            }
        );


        grid.appendChild(button);

    });

}


/* =========================
   PREVENT PAST DATES
========================= */

const dateInput =
    document.getElementById(
        "appointmentDate"
    );


const today =
    new Date()
        .toISOString()
        .split("T")[0];


dateInput.min = today;


/* =========================
   BOOK APPOINTMENT
========================= */

document
    .getElementById("bookingForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const customer =
                document
                    .getElementById(
                        "customerName"
                    )
                    .value
                    .trim();


            const phone =
                document
                    .getElementById(
                        "customerPhone"
                    )
                    .value
                    .trim();


            const email =
                document
                    .getElementById(
                        "customerEmail"
                    )
                    .value
                    .trim();


            const service =
                document
                    .getElementById(
                        "serviceSelect"
                    )
                    .value;


            const date =
                document
                    .getElementById(
                        "appointmentDate"
                    )
                    .value;


            const time =
                document
                    .getElementById(
                        "appointmentTime"
                    )
                    .value;


            if (!time) {

                alert(
                    "Please choose a time."
                );

                return;

            }


            /*
             * GET EXISTING APPOINTMENTS
             */

            let appointments =
                JSON.parse(
                    localStorage.getItem(
                        "appointments"
                    )
                ) || [];


            /*
             * CREATE APPOINTMENT
             */

            const newAppointment = {

                customer: customer,

                phone: phone,

                email: email,

                service: service,

                date: date,

                time: time,

                status: "Confirmed"

            };


            appointments.push(
                newAppointment
            );


            /*
             * SAVE APPOINTMENT
             */

            localStorage.setItem(
                "appointments",
                JSON.stringify(
                    appointments
                )
            );


            /*
             * SAVE CUSTOMER
             */

            let customers =
                JSON.parse(
                    localStorage.getItem(
                        "customers"
                    )
                ) || [];


            const existingCustomer =
                customers.find(
                    function(item) {

                        return (
                            item.phone === phone
                        );

                    }
                );


            if (!existingCustomer) {

                customers.push({

                    name: customer,

                    phone: phone,

                    email: email,

                    notes: "",

                    dateAdded:
                        new Date()
                            .toISOString()

                });


                localStorage.setItem(
                    "customers",
                    JSON.stringify(
                        customers
                    )
                );

            }


            /*
             * SHOW CONFIRMATION
             */

            document
                .getElementById(
                    "bookingCard"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "successCard"
                )
                .style.display =
                "block";


            document
                .getElementById(
                    "confirmation"
                )
                .innerHTML = `

                    <strong>Customer:</strong>
                    ${escapeHTML(customer)}
                    <br>

                    <strong>Service:</strong>
                    ${escapeHTML(service)}
                    <br>

                    <strong>Date:</strong>
                    ${escapeHTML(date)}
                    <br>

                    <strong>Time:</strong>
                    ${escapeHTML(time)}

                `;

        }
    );


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

loadBusiness();

loadServices();

createTimeSlots();

</script>

</body>
</html>
