<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment - AppointmentOS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #222;
}

.header {
    background: #071a3d;
    color: white;
    padding: 20px 40px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

.booking-card {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
    color: #071a3d;
    margin-bottom: 10px;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

.time-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.time-button {
    padding: 12px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 7px;
    cursor: pointer;
}

.time-button:hover {
    border-color: #071a3d;
}

.time-button.selected {
    background: #071a3d;
    color: white;
}

.book-button {
    width: 100%;
    margin-top: 30px;
    padding: 15px;
    background: #071a3d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.book-button:hover {
    background: #12366f;
}

.success {
    display: none;
    text-align: center;
    padding: 25px;
}

.success h2 {
    color: #187a35;
    margin-bottom: 10px;
}

.back-button {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 20px;
    background: #071a3d;
    color: white;
    text-decoration: none;
    border-radius: 7px;
}

@media (max-width: 600px) {

    .header {
        padding: 20px;
    }

    .container {
        margin: 20px auto;
        padding: 10px;
    }

    .booking-card {
        padding: 25px;
    }

    .time-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">AppointmentOS</div>
</div>


<div class="container">

    <div class="booking-card" id="bookingCard">

        <h1>Book an Appointment</h1>

        <p class="subtitle">
            Choose a service, date and time.
        </p>


        <form id="bookingForm">

            <label>
                Your Name
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
                required
            >


            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="customerPhone"
                placeholder="Enter your phone number"
                required
            >


            <label>
                Choose a Service
            </label>

            <select id="serviceSelect" required>

                <option value="">
                    Select a service
                </option>

            </select>


            <label>
                Choose a Date
            </label>

            <input
                type="date"
                id="appointmentDate"
                required
            >


            <label>
                Choose a Time
            </label>

            <div
                class="time-grid"
                id="timeGrid">
            </div>

            <input
                type="hidden"
                id="appointmentTime"
                required
            >


            <button
                type="submit"
                class="book-button">

                Book Appointment

            </button>

        </form>

    </div>


    <div
        class="booking-card success"
        id="successMessage">

        <h2>
            Appointment Booked!
        </h2>

        <p>
            Your appointment has been successfully booked.
        </p>

        <a
            href="booking.html"
            class="back-button">

            Book Another Appointment

        </a>

    </div>

</div>


<script>

/* LOAD SERVICES */

function loadServices() {

    const services =
        JSON.parse(
            localStorage.getItem("services")
        ) || [];


    const select =
        document.getElementById("serviceSelect");


    select.innerHTML = `
        <option value="">
            Select a service
        </option>
    `;


    services.forEach(function(service) {

        const option =
            document.createElement("option");

        option.value = service.name;

        option.textContent =
            service.name +
            " - R" +
            Number(service.price).toFixed(2);

        select.appendChild(option);

    });

}


/* CREATE TIME BUTTONS */

function createTimeButtons() {

    const timeGrid =
        document.getElementById("timeGrid");


    const times = [
        "08:00",
        "08:30",
        "09:00",
        "09:30",
        "10:00",
        "10:30",
        "11:00",
        "11:30",
        "12:00",
        "12:30",
        "13:00",
        "13:30",
        "14:00",
        "14:30",
        "15:00",
        "15:30",
        "16:00",
        "16:30"
    ];


    timeGrid.innerHTML = "";


    times.forEach(function(time) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "time-button";

        button.textContent = time;


        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(".time-button")
                    .forEach(function(btn) {

                        btn.classList.remove("selected");

                    });


                button.classList.add("selected");


                document
                    .getElementById("appointmentTime")
                    .value = time;

            }
        );


        timeGrid.appendChild(button);

    });

}


/* PREVENT PAST DATES */

const dateInput =
    document.getElementById("appointmentDate");


const today =
    new Date().toISOString().split("T")[0];


dateInput.min = today;


/* BOOK APPOINTMENT */

document
    .getElementById("bookingForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const customer =
                document
                    .getElementById("customerName")
                    .value
                    .trim();


            const phone =
                document
                    .getElementById("customerPhone")
                    .value
                    .trim();


            const service =
                document
                    .getElementById("serviceSelect")
                    .value;


            const date =
                document
                    .getElementById("appointmentDate")
                    .value;


            const time =
                document
                    .getElementById("appointmentTime")
                    .value;


            if (!time) {

                alert(
                    "Please choose an appointment time."
                );

                return;

            }


            let appointments =
                JSON.parse(
                    localStorage.getItem("appointments")
                ) || [];


            appointments.push({

                customer: customer,

                phone: phone,

                service: service,

                date: date,

                time: time

            });


            localStorage.setItem(
                "appointments",
                JSON.stringify(appointments)
            );


            /* ALSO SAVE CUSTOMER */

            let customers =
                JSON.parse(
                    localStorage.getItem("customers")
                ) || [];


            const existingCustomer =
                customers.find(function(existing) {

                    return existing.phone === phone;

                });


            if (!existingCustomer) {

                customers.push({

                    name: customer,

                    phone: phone,

                    email: "",

                    notes: "",

                    dateAdded:
                        new Date().toISOString()

                });


                localStorage.setItem(
                    "customers",
                    JSON.stringify(customers)
                );

            }


            document
                .getElementById("bookingCard")
                .style.display = "none";


            document
                .getElementById("successMessage")
                .style.display = "block";

        }
    );


/* START */

loadServices();

createTimeButtons();

</script>

</body>
</html>
